<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Wendigos_Cyber</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: #010205;
      color: #e7edf9;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      width: 90%;
      max-width: 600px;
      padding: 24px;
    }
    .brand {
      font-size: 14px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #8c97b1;
      margin-bottom: 20px;
      text-align: center;
    }
    textarea {
      width: 100%;
      min-height: 80px;
      resize: vertical;
      border: 1px solid rgba(148,163,184,0.16);
      background: rgba(255,255,255,0.02);
      color: #e7edf9;
      border-radius: 16px;
      padding: 12px;
      outline: none;
      font: inherit;
      line-height: 1.7;
      margin-bottom: 12px;
    }
    textarea:focus {
      border-color: rgba(138,164,255,0.36);
      box-shadow: 0 0 0 3px rgba(138,164,255,0.08);
    }
    #output {
      min-height: 200px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      white-space: pre;
    }
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 12px;
    }
    button {
      appearance: none;
      border: 1px solid rgba(148,163,184,0.24);
      background: rgba(255,255,255,0.02);
      color: #e7edf9;
      border-radius: 16px;
      padding: 13px 18px;
      min-height: 48px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s, background 0.15s;
      flex: 1;
    }
    button:hover {
      transform: translateY(-1px);
      border-color: rgba(138,164,255,0.34);
      background: rgba(255,255,255,0.04);
    }
    button:active { transform: translateY(0); }
    .primary {
      background: linear-gradient(135deg, rgba(138,164,255,0.18), rgba(155,123,255,0.18));
      border-color: rgba(138,164,255,0.28);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">Wendigos_Cyber</div>
    <textarea id="b1" placeholder="Body 1"></textarea>
    <textarea id="b2" placeholder="Body 2"></textarea>
    <textarea id="b3" placeholder="Body 3"></textarea>
    <textarea id="b4" placeholder="Body 4"></textarea>
    <textarea id="b5" placeholder="Body 5"></textarea>
    <textarea id="output" readonly placeholder="JSON output"></textarea>
    <div class="actions">
      <button class="primary" id="buildBtn">ساخت</button>
      <button id="copyBtn">کپی</button>
    </div>
  </div>
  <script>
    const FIXED_EMAILS = [
      "security@telegram.org",
      "abuse@telegram.org",
      "reports@telegram.org",
      "stopCA@telegram.org",
      "dmca@telegram.org"
    ];

    const DEFAULT_HEADERS = [

      "IMMEDIATE INVESTIGATION REQUESTED: Serious Privacy Violation",

      "HIGH PRIORITY: User Information Misuse – Immediate Attention Required",

      "URGENT: Report of Unauthorized Data Publication",
      "IMMEDIATE ACTION REQUESTED: Privacy Compromise and Data Leak",
      "CRITICAL: Confidential User Records Made Public",
      "URGENT: Sensitive Personal Data Mismanaged and Exposed",

      "URGENT: Data Protection Incident Involving Personal Information",
      "IMMEDIATE ATTENTION REQUIRED: Unauthorized Viewing and Sharing of User Data",
      "CRITICAL: User Privacy Leak – Immediate Intervention Needed",
      "URGENT REPORT: Confidential Information Shared Without Approval",
      "HIGH PRIORITY: Exposure of Private Communications",
      "CRITICAL: Unauthorized Dissemination of User Details",
      "URGENT: Personal Information Compromised in Data Breach",
      "IMMEDIATE REVIEW: Private User Data Released",
      "CRITICAL ALERT: Unauthorized Data Handling and Disclosure",
      "URGENT: Serious Privacy and Confidentiality Violation",
      "HIGH PRIORITY: User Data Exposure Requires Immediate Action",
      "CRITICAL: Sensitive User Data Shared Outside Authorized Channels",
      "URGENT REPORT: Private Information Exposure and Abuse",
      "IMMEDIATE ACTION REQUIRED: Personal Data Handling Violation",
      "CRITICAL: Unauthorized Disclosure of User Identity and Contact Data",
      "CRITICAL PRIVACY REPORT: Sensitive User Information Compromised"
    ];

    let lastJSON = "";

    const b1 = document.getElementById('b1');
    const b2 = document.getElementById('b2');
    const b3 = document.getElementById('b3');
    const b4 = document.getElementById('b4');
    const b5 = document.getElementById('b5');
    const output = document.getElementById('output');
    const buildBtn = document.getElementById('buildBtn');
    const copyBtn = document.getElementById('copyBtn');

    function build() {
      const bodies = [b1, b2, b3, b4, b5].map(t => t.value.trim());
      if (bodies.some(v => !v)) {
        lastJSON = '';
        output.value = '';
        return;
      }
      const data = {
        GmailTargets: FIXED_EMAILS,
        GmailHeadr: DEFAULT_HEADERS.slice(0, 100),
        GmailBody: bodies
      };
      const json = JSON.stringify(data, null, 2);
      lastJSON = json;
      output.value = json;
    }

    async function copyJSON() {
      if (!lastJSON) build();
      if (!lastJSON) return;
      try {
        await navigator.clipboard.writeText(lastJSON);
      } catch {
        output.focus();
        output.select();
        document.execCommand('copy');
      }
    }

    buildBtn.addEventListener('click', build);
    copyBtn.addEventListener('click', copyJSON);
  </script>
</body>
</html>
